<!DOCTYPE html>
<html lang="en">
<head>

    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(to right, #ffecd2 0%, #fcb69f 100%);

      text-align: center;
      padding: 50px;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 10px;
    }

      padding: 12px 24px;
      border: none;
      border-radius: 8px;

      cursor: pointer;
      transition: background-color 0.3s ease;

    button:hover {

    }
